[global]
q = "exit"
Up = "move_up"
Down = "move_down"
j = "move_down"
k = "move_up"

[file_panel]
h = "go_parent"
l = "open_entry"
Tab = "focus_sidebar"
Enter = "open_entry"
Right = "open_entry"
Left = "go_parent"
m = "focus_metadata"
e = "open_editor"
n = "new_entry"
y = "copy_entry"
c = "focus_clipboard"

[sidebar]
h = "focus_files"
Tab = "focus_files"
l = "open_bookmark"
Right = "open_bookmark"
Enter = "open_bookmark"

[metadata]
Esc = "exit_metadata"
y = "copy_metadata"
Space = "copy_metadata"

# -------------------------
# ----- Create Mode
# -------------------------
[create]
Esc = "cancel_create"
Enter = "confirm_create"
Left = "move_cursor_left"
Right = "move_cursor_right"
Backspace = "delete_char"

# -------------------------
# ----- File Clipboard Mode
# -------------------------

[file_clipboard]
Esc = "exit_clipboard"
d = "remove_entry"
c = "clear_clipboard"
